# menu and terminal
#bind=SUPER,r,spawn,noctalia msg panel-toggle launcher
bind=SUPER,t,spawn,kitty
bind=SUPER,e,spawn,dolphin
bind=SUPER,r,spawn,fuzzel

# exit
#bind=SUPER,m,quit
bind=SUPER,c,killclient,
bind=ALT,F4,killclient,force

# switch window status
bind=SUPER,code:56,toggleglobal, #backslash
bind=ALT,Tab,focusstack,next
bind=SUPER,v,togglefloating,
bind=SUPER+SHIFT,v,centerwin
bind=SUPER,m,togglemaximizescreen,
bind=SUPER,f,togglefullscreen,
#bind=SUPER,m,togglefakefullscreen,
#bind=SUPER,o,toggleoverlay,

bind=SUPER,code:49,toggle_special_tag
bind=SUPER+SHIFT,code:49,tag_special_tag
#bind=SUPER+ALT,code:49,restore_minimized

# noctalia
bind=SUPER+SHIFT,w,spawn,noctalia msg panel-toggle wallpaper
bind=SUPER+ALT,w,spawn,noctalia msg panel-toggle noctalia/mpvpaper:picker
bind=SUPER,comma,spawn,noctalia msg settings-open

bind=NONE,PRINT,spawn,noctalia msg screenshot-region
bind=SUPER,PRINT,spawn,noctalia msg screenshot-fullscreen
bind=SUPER+SHIFT,PRINT,spawn,noctalia msg screenshot-window

bind=SUPER,code:51,spawn,noctalia msg panel-toggle yuuto/calculator:panel
bind=SUPER+SHIFT,m,spawn,noctalia msg panel-toggle prponkshe/mango-displays:panel
bind=SUPER+SHIFT+ALT,m,spawn,noctalia msg panel-toggle prponkshe/mango-displays:advanced

# volume knob
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05-
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05+ -l 1.0

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,
bind=alt+super+ctrl,Left,scroller_stack,left
bind=alt+super+ctrl,Right,scroller_stack,right
bind=alt+super+ctrl,Up,scroller_stack,up
bind=alt+super+ctrl,Down,scroller_stack,down

#dwindle layout(manual split mode)
bind=SUPER,j,dwindle_toggle_split_direction

# switch layout
bind=SUPER,n,switch_layout

