# menu and terminal
bind=SUPER,t,spawn,kitty
bind=SUPER,e,spawn,dolphin
bind=SUPER,r,spawn,fuzzel

# exit
bind=SUPER,c,killclient,
bind=ALT,F4,killclient,force

# switch window status
bind=SUPER,code:56,toggleglobal, #backslash
bind=ALT,Tab,focusstack,next
bind=SUPER,v,togglefloating,
bind=SUPER+SHIFT,v,centerwin
bind=SUPER,m,togglemaximizescreen,
bind=SUPER,f,togglefullscreen,

bind=SUPER,code:49,toggle_special_tag
bind=SUPER+SHIFT,code:49,tag_special_tag

# noctalia
bind=SUPER+SHIFT,w,spawn,noctalia msg panel-toggle wallpaper
bind=SUPER+ALT,w,spawn,noctalia msg panel-toggle noctalia/mpvpaper:picker
bind=SUPER,comma,spawn,noctalia msg settings-open

bind=NONE,PRINT,spawn,noctalia msg screenshot-region
bind=SUPER,PRINT,spawn,noctalia msg screenshot-fullscreen
bind=SUPER+SHIFT,PRINT,spawn,noctalia msg screenshot-window

bind=SUPER,code:51,spawn,noctalia msg panel-toggle yuuto/calculator:panel
bind=SUPER+SHIFT,m,spawn,noctalia msg panel-toggle prponkshe/mango-displays:panel
bind=SUPER+SHIFT+ALT,m,spawn,noctalia msg panel-toggle prponkshe/mango-displays:advanced

# volume knob
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05-
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.05+ -l 1.0

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,
bind=alt+super+ctrl,Left,scroller_stack,left
bind=alt+super+ctrl,Right,scroller_stack,right
bind=alt+super+ctrl,Up,scroller_stack,up
bind=alt+super+ctrl,Down,scroller_stack,down

#dwindle layout(manual split mode)
bind=SUPER,j,dwindle_toggle_split_direction

# switch layout
bind=SUPER,n,switch_layout

# Main display
bind=SUPER,1,viewcrossmon,1,DP-2
bind=SUPER,2,viewcrossmon,2,DP-2
bind=SUPER,3,viewcrossmon,3,DP-2
bind=SUPER,4,viewcrossmon,4,DP-2
bind=SUPER,5,viewcrossmon,5,DP-2
bind=SUPER,6,viewcrossmon,6,DP-2
bind=SUPER,7,viewcrossmon,7,DP-2
bind=SUPER,8,viewcrossmon,8,DP-2
bind=SUPER,9,viewcrossmon,9,DP-2

bind=SUPER+shift,1,tagcrossmon,1,DP-2
bind=SUPER+shift,2,tagcrossmon,2,DP-2
bind=SUPER+shift,3,tagcrossmon,3,DP-2
bind=SUPER+shift,4,tagcrossmon,4,DP-2
bind=SUPER+shift,5,tagcrossmon,5,DP-2
bind=SUPER+shift,6,tagcrossmon,6,DP-2
bind=SUPER+shift,7,tagcrossmon,7,DP-2
bind=SUPER+shift,8,tagcrossmon,8,DP-2
bind=SUPER+shift,9,tagcrossmon,9,DP-2

# Secondary display
bind=SUPER+ALT,1,viewcrossmon,1,DP-1
bind=SUPER+ALT,2,viewcrossmon,2,DP-1
bind=SUPER+ALT,3,viewcrossmon,3,DP-1
bind=SUPER+ALT,4,viewcrossmon,4,DP-1
bind=SUPER+ALT,5,viewcrossmon,5,DP-1
bind=SUPER+ALT,6,viewcrossmon,6,DP-1
bind=SUPER+ALT,7,viewcrossmon,7,DP-1
bind=SUPER+ALT,8,viewcrossmon,8,DP-1
bind=SUPER+ALT,9,viewcrossmon,9,DP-1

bind=SUPER+ALT+shift,1,tagcrossmon,1,DP-1
bind=SUPER+ALT+shift,2,tagcrossmon,2,DP-1
bind=SUPER+ALT+shift,3,tagcrossmon,3,DP-1
bind=SUPER+ALT+shift,4,tagcrossmon,4,DP-1
bind=SUPER+ALT+shift,5,tagcrossmon,5,DP-1
bind=SUPER+ALT+shift,6,tagcrossmon,6,DP-1
bind=SUPER+ALT+shift,7,tagcrossmon,7,DP-1
bind=SUPER+ALT+shift,8,tagcrossmon,8,DP-1
bind=SUPER+ALT+shift,9,tagcrossmon,9,DP-1

bind=SUPER+CTRL,1,viewcrossmon,1,HDMI-A-1

# gaps
bind=SUPER,g,togglegaps

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
mouse_natural_scrolling=0
