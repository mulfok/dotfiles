# keyboard
repeat_rate=25
repeat_delay=600
numlock_on=0
xkb_rules_layout=gb
xkb_rules_variant=colemak_dh

# drawing tablet (this actually works?)
#device_rule=name:Wacom.*,monitor:DP-2
device_rule=type:tablet,monitor:DP-2

# Trackpad
# need relogin to make it apply
disable_trackpad=1

# Mouse settings stuff
mouse_accel_profile = 1
mouse_accel_speed = -0.4 # this is a relative adjustment
